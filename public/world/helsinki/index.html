<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helsinki, 60°10′N — Dagdroøm</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { background: #111; color: #f5f1eb; font-family: Arial, Helvetica, sans-serif; }
    .helsinki-page {
      position: relative;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background: #111 url("/helsinki-60n.png") center center / cover no-repeat;
    }
    .helsinki-page::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 12, 14, 0.58), rgba(10, 12, 14, 0.02) 55%);
      pointer-events: none;
    }
    .back-link { position: absolute; top: 42px; left: 52px; z-index: 2; color: inherit; font-size: 14px; text-decoration: none; }
    .city-heading { position: absolute; left: 52px; bottom: 52px; z-index: 2; }
    .city-heading h1 {
      margin: 0 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 5vw, 76px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -2px;
    }
    .city-heading p { margin: 0; font-size: 12px; letter-spacing: 6px; text-transform: uppercase; }
    .journal-mark {
      position: absolute;
      right: 48px;
      bottom: 52px;
      z-index: 2;
      font-size: 9px;
      letter-spacing: 4px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
    @media (max-width: 768px) {
      .helsinki-page { background-position: 53% center; }
      .back-link { top: 26px; left: 24px; }
      .city-heading { left: 24px; bottom: 34px; }
      .city-heading h1 { font-size: 44px; letter-spacing: -1px; }
      .city-heading p { font-size: 10px; letter-spacing: 4px; }
      .journal-mark { display: none; }
    }
  </style>
  <script src="/static-i18n.js" defer></script>
</head>
<body>
  <main class="helsinki-page">
    <a class="back-link" href="/journal" aria-label="Back to Journal">←</a>
    <div class="city-heading"><h1>Helsinki,</h1><p>60°10′N</p></div>
    <div class="journal-mark">JOURNAL — N° 005</div>
  </main>
</body>
</html>
